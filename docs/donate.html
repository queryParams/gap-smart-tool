<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Поддержать GAP Smart Tool</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #ededed; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; justify-content: center; }
  main { width: 100%; max-width: 420px; padding: 44px 22px 32px; }
  .logo { font-size: 32px; letter-spacing: 1px; font-weight: 700; }
  .logo small { display: block; font-size: 10px; letter-spacing: 4px; font-weight: 400; margin-top: 2px; color: #c9a33a; }
  h1 { font-size: 26px; font-weight: 400; margin: 46px 0 0; line-height: 1.25; }
  .sub { color: #8c8c8c; font-size: 15px; margin-top: 10px; line-height: 1.45; }
  .box { margin-top: 34px; border: 2px solid #2c3138; border-radius: 20px; padding: 18px; background: linear-gradient(#171b22, #05070a); }
  .k { font-size: 12px; letter-spacing: 3px; color: #8c8c8c; }
  .num { font-family: ui-monospace, "Roboto Mono", Menlo, monospace; font-size: 21px; margin-top: 10px; white-space: nowrap; }
  .who { color: #8c8c8c; font-size: 14px; margin-top: 8px; }
  button { display: flex; align-items: center; justify-content: center; width: 100%; height: 54px; border-radius: 16px; margin-top: 14px;
           font: inherit; font-size: 18px; cursor: pointer; color: #f3d79b; border: 2px solid #c9a33a;
           background: radial-gradient(120% 80% at 50% 0, #3d331a, #0d0b07 70%); -webkit-tap-highlight-color: transparent; }
  button.done { opacity: .75; }
  .foot { color: #6f757c; font-size: 13px; margin-top: 26px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <div class="logo">GAP<small>SMART TOOL</small></div>
  <h1>Спасибо, что поддерживаете GAP Smart Tool</h1>
  <div class="sub">Приложение бесплатное и без рекламы. Перевод — на карту Сбербанка по номеру, любая сумма.</div>
  <div class="box">
    <div class="k">КАРТА СБЕРБАНКА</div>
    <div class="num" id="num">2202 2088 7002 0337</div>
    <div class="who">Илья А.</div>
  </div>
  <button id="copy" type="button">Скопировать номер</button>
  <div class="foot">Откройте приложение своего банка → перевод по номеру карты → вставьте номер (карта Сбербанка).</div>
</main>
<script>
  (function () {
    var b = document.getElementById('copy');
    var num = document.getElementById('num').textContent.replace(/\s/g, '');
    function done() {
      b.textContent = 'Скопировано ✓';
      b.classList.add('done');
      setTimeout(function () { b.textContent = 'Скопировать номер'; b.classList.remove('done'); }, 1600);
    }
    // Старые браузеры без Clipboard API — через выделение временного поля.
    function fallback() {
      var t = document.createElement('textarea');
      t.value = num;
      t.setAttribute('readonly', '');
      t.style.position = 'fixed';
      t.style.opacity = '0';
      document.body.appendChild(t);
      t.select();
      try { document.execCommand('copy'); } catch (e) { }
      document.body.removeChild(t);
      done();
    }
    b.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(num).then(done, fallback);
      } else {
        fallback();
      }
    });
  })();
</script>
</body>
</html>
